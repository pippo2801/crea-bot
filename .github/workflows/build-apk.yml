name: Android project checks (APK only on explicit request)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Android project without packaging an APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Confirm Android SDK tools are available
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-not-set}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-not-set}"
          command -v sdkmanager
          sdkmanager --version

      - name: Install required Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Validate Java and Gradle
        run: |
          java -version
          gradle --version

      - name: Run unit tests only
        run: gradle --no-daemon testDebugUnitTest
